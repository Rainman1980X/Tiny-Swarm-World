name: Nightly Classic Live

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      live_approval:
        description: "Explicitly authorize the protected Classic live target"
        required: true
        type: choice
        options: [approve, block]
      target_owner:
        description: "Redacted target-owner reference"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: classic-live-${{ github.repository }}
  cancel-in-progress: false

env:
  CLASSIC_LIVE_RUNNER_LABEL: tsw-classic
  TSW_LIVE_RUNNER_VERIFIED: "1"
  TSW_INSTALL_ENV_FILE: ${{ vars.TSW_CLASSIC_LIVE_ENV_FILE }}
  TSW_LIVE_EVIDENCE_ROOT: ${{ vars.TSW_CLASSIC_LIVE_EVIDENCE_ROOT }}
  TSW_CLASSIC_TARGET_OWNER: ${{ inputs.target_owner || vars.TSW_CLASSIC_TARGET_OWNER }}
  TSW_CLASSIC_UPDATE_STACK: ${{ vars.TSW_CLASSIC_UPDATE_STACK }}
  TSW_CLASSIC_UPDATE_SERVICE: ${{ vars.TSW_CLASSIC_UPDATE_SERVICE }}
  TSW_CLASSIC_UPDATE_FROM_IMAGE: ${{ vars.TSW_CLASSIC_UPDATE_FROM_IMAGE }}
  TSW_CLASSIC_UPDATE_TO_IMAGE: ${{ vars.TSW_CLASSIC_UPDATE_TO_IMAGE }}

jobs:
  qualify-runner:
    name: Qualify Classic live runner
    if: ${{ always() }}
    runs-on: [self-hosted, linux, tsw-classic]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Reject blocked manual execution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_approval != 'approve' }}
        run: |
          set -Eeuo pipefail
          echo "Classic live execution was explicitly blocked; required live evidence is not green."
          exit 1

      - name: Require Linux and owned live target
        env:
          TARGET_OWNER: ${{ inputs.target_owner || vars.TSW_CLASSIC_TARGET_OWNER }}
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = Linux
          test -n "${RUNNER_NAME}"
          test -n "${TARGET_OWNER}"
          test -n "${TSW_INSTALL_ENV_FILE}"
          test -n "${TSW_LIVE_EVIDENCE_ROOT}"
          python3 tools/install_debugger.py --live --env-file "${TSW_INSTALL_ENV_FILE}"
          python3 - <<'PY'
          import platform
          import sys

          if platform.system() != "Linux":
              raise SystemExit("Classic live runner must be Linux")
          print("runner-capability=linux")
          print(f"python={sys.version_info.major}.{sys.version_info.minor}")
          PY
          command -v incus
          command -v docker
          incus version
          docker version --format '{{.Server.Version}}'

  classic-live:
    name: Execute Classic live chain
    needs: qualify-runner
    if: ${{ needs.qualify-runner.result == 'success' }}
    runs-on: [self-hosted, linux, tsw-classic]
    environment:
      name: tiny-swarm-world-classic-live
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Run redacted Classic live chain
        run: |
          set -Eeuo pipefail
          python3 tools/live/run_classic_acceptance.py --approve-live \
            --test-only \
            --env-file "${TSW_INSTALL_ENV_FILE}" \
            --evidence-root "${TSW_LIVE_EVIDENCE_ROOT}"

      - name: Upload redacted live evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classic-live-evidence-${{ github.run_id }}
          path: ${{ env.TSW_LIVE_EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 14
